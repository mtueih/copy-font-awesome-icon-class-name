name: Font Awesome site check

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-fontawesome-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: python -m pip install playwright==1.63.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Font Awesome icon page
        run: python .github/scripts/check_fontawesome_page.py
